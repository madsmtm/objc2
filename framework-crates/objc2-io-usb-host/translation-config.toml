fn.IOUSBHostCIPortStateToString.return.bounds = "unsafe"
fn.IOUSBHostCIDeviceStateToString.return.bounds = "unsafe"
fn.IOUSBHostCIEndpointStateToString.return.bounds = "unsafe"

