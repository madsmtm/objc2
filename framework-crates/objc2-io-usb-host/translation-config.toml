framework = "IOUSBHost"
crate = "objc2-io-usb-host"
required-crates = ["objc2", "objc2-foundation"]
custom-lib-rs = true
macos = "10.15"
maccatalyst = "14.0"

# Return type nullability is incorrectly declared in the header. It should be `nullable` instead of `nonnull`.
class.IOUSBHostControllerInterface.methods."getPortStateMachineForCommand:error:".return.nullability = "nullable"
class.IOUSBHostControllerInterface.methods."getPortStateMachineForPort:error:".return.nullability = "nullable"

# Declared twice.
static.IOUSBHostMatchingPropertyKeyProductIDMask.skipped = true

# Value taken from a type that is c_uint internally.
const.IOUSBHostCITransferCompletionMessageControlStatus.use-value = true
const.IOUSBHostCITransferCompletionMessageControlStatusPhase.use-value = true

# Overflows while calculating on 32-bit.
const.IOUSBHostCIEndpointCreateCommandData1Descriptor.skipped = true
const.IOUSBHostCIEndpointUpdateCommandData1Descriptor.skipped = true
const.IOUSBHostCIEndpointSetNextTransferCommandData1Address.skipped = true
const.IOUSBHostCISetupTransferData1wIndex.skipped = true
const.IOUSBHostCISetupTransferData1wLength.skipped = true
const.IOUSBHostCITransferCompletionMessageData1TransferStructure.skipped = true

# Fix generics.
class.IOUSBHostDevice.methods."createMatchingDictionaryWithVendorID:productID:bcdDevice:deviceClass:deviceSubclass:deviceProtocol:speed:productIDArray:".return.generics = ["CoreFoundation.CFString.CFString", "CoreFoundation.CFType"]
class.IOUSBHostInterface.methods."createMatchingDictionaryWithVendorID:productID:bcdDevice:interfaceNumber:configurationValue:interfaceClass:interfaceSubclass:interfaceProtocol:speed:productIDArray:".return.generics = ["CoreFoundation.CFString.CFString", "CoreFoundation.CFType"]

##
## Pointer bounds
##

# AppleUSBDescriptorParsing.h
# Safety of e.g. IOUSBConfigurationDescriptor and IOUSBDescriptorHeader as
# references is unclear, perhaps these types should be opaque?
#
# Also unclear if the getter methods could be safe, they might go beoynd the
# formal bounds of the types internally to parse stuff?
#
# fn.IOUSB*Descriptor.arguments.*.bounds = "unsafe"

# All null-terminated, but needs to also have static lifetime
fn.IOUSBHostCIMessageTypeToString.return.bounds = "unsafe"
fn.IOUSBHostCIMessageStatusToString.return.bounds = "unsafe"
fn.IOUSBHostCILinkStateToString.return.bounds = "unsafe"
fn.IOUSBHostCIDeviceSpeedToString.return.bounds = "unsafe"
