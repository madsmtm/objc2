framework = "MediaAccessibility"
crate = "objc2-media-accessibility"
required-crates = ["objc2-core-foundation"]
macos = "10.9"
maccatalyst = "13.0"
ios = "17.0"
tvos = "17.0"
visionos = "1.0"

# Fix generics.
fn.MACaptionAppearanceDidDisplayCaptions.arguments.0.generics = ["CoreFoundation.CFType"] # CFString or CFAttributedString
fn.MACaptionAppearanceCopySelectedLanguages.return.generics = ["CoreFoundation.CFString.CFString"]
fn.MACaptionAppearanceCopyPreferredCaptioningMediaCharacteristics.return.generics = ["CoreFoundation.CFString.CFString"]
fn.MACaptionAppearanceCopyProfileIDs.return.generics = ["CoreFoundation.CFString.CFString"]
fn.MAAudibleMediaCopyPreferredCharacteristics.return.generics = ["CoreFoundation.CFString.CFString"]

# Pointer bounds
fn.MACaptionAppearanceCopyForegroundColor.arguments.1.bounds = "single"
fn.MACaptionAppearanceCopyBackgroundColor.arguments.1.bounds = "single"
fn.MACaptionAppearanceCopyWindowColor.arguments.1.bounds = "single"
fn.MACaptionAppearanceGetForegroundOpacity.arguments.1.bounds = "single"
fn.MACaptionAppearanceGetBackgroundOpacity.arguments.1.bounds = "single"
fn.MACaptionAppearanceGetWindowOpacity.arguments.1.bounds = "single"
fn.MACaptionAppearanceGetWindowRoundedCornerRadius.arguments.1.bounds = "single"
fn.MACaptionAppearanceCopyFontDescriptorForStyle.arguments.1.bounds = "single"
fn.MACaptionAppearanceGetRelativeCharacterSize.arguments.1.bounds = "single"
fn.MACaptionAppearanceGetTextEdgeStyle.arguments.1.bounds = "single"
