framework = "DeviceCheck"
crate = "objc2-device-check"
required-crates = ["objc2", "objc2-foundation"]
macos = "10.15"
maccatalyst = "13.0"
ios = "11.0"
tvos = "11.0"
watchos = "9.0"
visionos = "1.0"

unsafe-default-safety.documentation-is-reviewed = true
unsafe-default-safety.bounds-checked-internally = true

# The first call lazily creates the service's controller with an unsynchronized
# load and store, so it must not race another call on the same instance.
class.DCAppAttestService.methods.isSupported.unsafe = true
class.DCAppAttestService.methods."generateKeyWithCompletionHandler:".unsafe = true
class.DCAppAttestService.methods."attestKey:clientDataHash:completionHandler:".unsafe = true
class.DCAppAttestService.methods."generateAssertion:clientDataHash:completionHandler:".unsafe = true
